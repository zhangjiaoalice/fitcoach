# FitCoach 本地开发编排文件
# 本地用 Podman 运行：podman compose up -d
# 上线腾讯云时同一份文件可直接用 docker compose 跑。
services:
  db:
    # pgvector 官方镜像 = PostgreSQL 16 + 已预装 pgvector 扩展
    # 这样 M8 做 RAG 向量检索时不用再单独装扩展。
    image: docker.io/pgvector/pgvector:pg16
    container_name: fitcoach-db
    environment:
      POSTGRES_USER: fitcoach
      POSTGRES_PASSWORD: fitcoach_dev_pwd
      POSTGRES_DB: fitcoach
    ports:
      # 宿主机 5433 -> 容器 5432，用 5433 避免和你 Homebrew 本地 PG(5432) 冲突
      - "5433:5432"
    volumes:
      - fitcoach_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitcoach -d fitcoach"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitcoach_pgdata:
